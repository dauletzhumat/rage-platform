name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supply chain (SEC-M0-L9): every action is pinned to a full commit SHA with its release tag
# in a trailing comment; Dependabot (github-actions ecosystem) proposes SHA bumps.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ephemeral CI service containers; same dev-only placeholders as .env.example.
  # Owner role (migrations, db:grants, seeds) vs non-superuser app role (API) — ADR-016.
  MIGRATION_DATABASE_URL: postgresql://rage:rage_dev_password@127.0.0.1:5432/rage?schema=public
  DATABASE_URL: postgresql://rage_app:rage_app_dev_password@127.0.0.1:5432/rage?schema=public
  RAGE_APP_DB_PASSWORD: rage_app_dev_password
  # Integration tests reset schemas, so they keep the owner role.
  TEST_DATABASE_URL: postgresql://rage:rage_dev_password@127.0.0.1:5432/rage_test?schema=public
  REDIS_URL: redis://127.0.0.1:6379
  NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  API_INTERNAL_URL: http://localhost:4000/api/v1
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: rage
          POSTGRES_PASSWORD: rage_dev_password
          POSTGRES_DB: rage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U rage -d rage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.10.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare .env from template
        run: cp .env.example .env

      - name: Create integration-test database
        run: psql "postgresql://rage:rage_dev_password@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE rage_test OWNER rage'

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Migrate fresh database (owner role)
        run: pnpm --filter @rage/db migrate:deploy

      - name: Create/update app role and grants (owner role)
        run: pnpm --filter @rage/db db:grants

      - name: Verify app role can connect and is not privileged
        run: |
          # libpq rejects Prisma's `?schema=` parameter, so strip the query string.
          psql "${DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -tAc \
            "SELECT current_user, rolsuper, rolcreatedb, rolcreaterole FROM pg_roles WHERE rolname = current_user" \
            | tee /dev/stderr | grep -qx 'rage_app|f|f|f'

      - name: Seed (base + sample data)
        run: |
          pnpm --filter @rage/db seed
          pnpm --filter @rage/db seed:sample

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: OpenAPI client drift check
        run: |
          pnpm openapi:generate
          if [ -n "$(git status --porcelain -- packages/api-client)" ]; then
            echo "::error::packages/api-client is out of date. Run 'pnpm openapi:generate' and commit the result."
            git status --porcelain -- packages/api-client
            git --no-pager diff --stat -- packages/api-client
            exit 1
          fi

  e2e:
    name: Web e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Blocking since the first green run on GitHub (2026-11-12, run 43248240833).
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: rage
          POSTGRES_PASSWORD: rage_dev_password
          POSTGRES_DB: rage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U rage -d rage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.10.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare .env from template
        run: cp .env.example .env

      - name: Prepare database (owner role; then app role grants)
        run: |
          pnpm db:generate
          pnpm --filter @rage/db migrate:deploy
          pnpm --filter @rage/db db:grants
          pnpm --filter @rage/db seed
          pnpm --filter @rage/db seed:sample

      - name: Generate per-run auth secrets
        # Test-only values, never stored: masked and exported for later steps (API and web SSR).
        run: |
          gen() { node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"; }
          session_secret="$(gen)"
          ssr_token="$(gen)"
          echo "::add-mask::$session_secret"
          echo "::add-mask::$ssr_token"
          {
            echo "SESSION_SECRET=$session_secret"
            echo "INTERNAL_SSR_TOKEN=$ssr_token"
          } >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @rage/web exec playwright install --with-deps chromium

      - name: Start API in background (app role)
        env:
          # DATABASE_URL (workflow env) is the non-superuser app role.
          WEB_PUBLIC_URL: http://localhost:3000
          STEAM_OPENID_REALM: http://localhost:4000
          STEAM_OPENID_RETURN_URL: http://localhost:4000/api/v1/auth/steam/callback
        run: |
          nohup node apps/api/dist/main.js > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4000/api/v1/health/ready >/dev/null; then
              echo "API ready"; exit 0
            fi
            sleep 1
          done
          echo "::error::API did not become ready"; cat api.log; exit 1

      - name: Check API connects as app role and Steam auth is configured
        run: |
          # Touch the DB through the API, then look for its session (the pool may idle-close later).
          curl -fsS http://127.0.0.1:4000/api/v1/health/ready >/dev/null
          psql "${MIGRATION_DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -tAc \
            "SELECT DISTINCT usename FROM pg_stat_activity WHERE datname = 'rage' AND usename <> 'rage'" \
            | tee /dev/stderr | grep -qx rage_app
          status="$(curl -fsS http://127.0.0.1:4000/api/v1/meta | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d)?.features?.steamAuth?.status))")"
          echo "steamAuth status: $status"
          test "$status" = configured || { echo "::error::expected steamAuth configured"; cat api.log; exit 1; }

      - name: Run Playwright
        run: pnpm --filter @rage/web test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            api.log
          retention-days: 7
          if-no-files-found: ignore
