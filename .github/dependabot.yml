version: 2
updates:
  # pnpm workspace (Dependabot's npm ecosystem understands pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Mirror pnpm-workspace.yaml `minimumReleaseAge` (7 days) for supply-chain hygiene.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      next-react:
        patterns:
          ['next', 'eslint-config-next', 'react', 'react-dom', '@types/react', '@types/react-dom']
      lint-format:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'prettier', 'globals']

  # Actions are pinned to full commit SHAs with a `# vX.Y.Z` comment (SEC-M0-L9);
  # Dependabot bumps both the SHA and the comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7

  # Dockerfile base images.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7

  # Images pinned in docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
