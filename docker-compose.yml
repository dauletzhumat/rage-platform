# RAGE Platform — local development stack.
#
#   docker compose up -d                          # postgres + redis (infra only)
#   docker compose --profile storage up -d        # + S3-compatible object storage (SeaweedFS) + bucket bootstrap
#   docker compose --profile app up -d --build    # + migrate (one-shot: migrations + db:grants) + api + web
#   docker compose --profile seed run --rm seed   # run the dev seed against the compose database
#
# Every published port is bound to 127.0.0.1 only. Never publish Postgres, Redis or
# the object store on a public interface. Credentials below are DEV DEFAULTS that
# match .env.example and may be overridden from `.env` (compose reads it for
# interpolation). Secrets (SESSION_SECRET, INTERNAL_SSR_TOKEN, STEAM_WEB_API_KEY) have
# NO defaults: without them the API reports steamAuth `unconfigured`.
# This file is for local development only — see docs/RUNBOOK.md.
#
# Database roles (ADR-016): `migrate`/`seed` connect as the OWNER (POSTGRES_USER);
# `api` connects as the non-superuser app role created by `db:grants` in `migrate`.

name: rage

services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rage_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rage}
      # Consumed by docker/postgres/init/01-create-test-db.sh (first boot only).
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-rage_test}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      # postgres >= 18 images keep PGDATA under /var/lib/postgresql/<major>/docker,
      # so the volume is mounted at the parent directory (not .../data).
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: the temporary server used while init scripts run listens on the
      # unix socket only, so this reports healthy only after initialisation finished.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    shm_size: 256mb

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    # AOF on so BullMQ jobs survive a container restart; noeviction is required by BullMQ.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  # --- S3-compatible object storage (used from M5: demos, logos) --------------------
  # SeaweedFS `weed mini` (Apache-2.0): single process running master+volume+filer+S3.
  # S3 API listens on 8333 inside the container and is published on 127.0.0.1:9000 so
  # that S3_ENDPOINT in .env.example works unchanged. See docs/RUNBOOK.md for rationale.
  s3:
    image: chrislusf/seaweedfs:4.52
    profiles: ['storage']
    restart: unless-stopped
    command: ['mini', '-dir=/data']
    environment:
      # Static admin identity for the S3 API (dev only).
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rage_dev_access_key}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rage_dev_secret_key}
    ports:
      - '127.0.0.1:${S3_HOST_PORT:-9000}:8333'
    volumes:
      - s3-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8333/healthz >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # One-shot, idempotent bucket bootstrap. Backend-agnostic (plain S3 API calls).
  s3-init:
    image: amazon/aws-cli:2.39.5
    profiles: ['storage']
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rage_dev_access_key}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rage_dev_secret_key}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: 'true'
      S3_BUCKET: ${S3_BUCKET:-rage-local}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        ep=http://s3:8333
        if aws --endpoint-url "$$ep" s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null; then
          echo "bucket $$S3_BUCKET already exists"
        else
          aws --endpoint-url "$$ep" s3api create-bucket --bucket "$$S3_BUCKET"
          echo "bucket $$S3_BUCKET created"
        fi
    restart: 'no'

  # --- Application containers (profile: app) ----------------------------------------
  # One-shot, as the OWNER role: applies committed Prisma migrations (never
  # `migrate dev` / reset), then creates/updates the app role and its grants (idempotent).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: rage/api-tools:local
    profiles: ['app', 'seed']
    command:
      - sh
      - -c
      - >-
        set -e;
        pnpm --filter @rage/db migrate:deploy;
        pnpm --filter @rage/db db:grants
    environment:
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-rage}:${POSTGRES_PASSWORD:-rage_dev_password}@postgres:5432/${POSTGRES_DB:-rage}?schema=public
      DATABASE_URL: postgresql://${RAGE_APP_DB_ROLE:-rage_app}:${RAGE_APP_DB_PASSWORD:-rage_app_dev_password}@postgres:5432/${POSTGRES_DB:-rage}?schema=public
      RAGE_APP_DB_PASSWORD: ${RAGE_APP_DB_PASSWORD:-rage_app_dev_password}
      RAGE_APP_DB_ROLE: ${RAGE_APP_DB_ROLE:-rage_app}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Dev seed (explicit opt-in): docker compose --profile seed run --rm seed
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: rage/api-tools:local
    profiles: ['seed']
    command: ['pnpm', '--filter', '@rage/db', 'seed']
    environment:
      # Seeds run as the OWNER (Prisma CLI/seeds prefer MIGRATION_DATABASE_URL).
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-rage}:${POSTGRES_PASSWORD:-rage_dev_password}@postgres:5432/${POSTGRES_DB:-rage}?schema=public
      DATABASE_URL: postgresql://${RAGE_APP_DB_ROLE:-rage_app}:${RAGE_APP_DB_PASSWORD:-rage_app_dev_password}@postgres:5432/${POSTGRES_DB:-rage}?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: rage/api:local
    profiles: ['app']
    init: true
    restart: unless-stopped
    environment:
      # The image defaults to production; this local stack serves plain-http origins,
      # which the API's env validation (correctly) rejects in production mode.
      NODE_ENV: ${API_CONTAINER_NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PORT: 4000
      API_HOST: 0.0.0.0
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      # Non-superuser app role (created by `db:grants` in `migrate`), never the owner.
      DATABASE_URL: postgresql://${RAGE_APP_DB_ROLE:-rage_app}:${RAGE_APP_DB_PASSWORD:-rage_app_dev_password}@postgres:5432/${POSTGRES_DB:-rage}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-rage-local}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rage_dev_access_key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rage_dev_secret_key}
      S3_FORCE_PATH_STYLE: 'true'
      # M1 Steam OpenID / sessions (docs/AUTH.md §2). Localhost URLs default for dev;
      # secrets have no default (empty = unset => steamAuth `unconfigured`, auth routes 503).
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
      STEAM_OPENID_REALM: ${STEAM_OPENID_REALM:-http://localhost:4000}
      STEAM_OPENID_RETURN_URL: ${STEAM_OPENID_RETURN_URL:-http://localhost:4000/api/v1/auth/steam/callback}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-336}
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-72}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      BOOTSTRAP_SUPER_ADMIN_STEAM_ID64: ${BOOTSTRAP_SUPER_ADMIN_STEAM_ID64:-}
      # Shared with `web` (same value). Authenticates SSR calls (client-IP throttling).
      INTERNAL_SSR_TOKEN: ${INTERNAL_SSR_TOKEN:-}
    ports:
      - '127.0.0.1:${API_HOST_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Readiness (DB + Redis) gates `web`; the image HEALTHCHECK uses liveness.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        # NEXT_PUBLIC_* are inlined into the client bundle at BUILD time.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: rage/web:local
    profiles: ['app']
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Server-side rendering talks to the API over the compose network.
      API_INTERNAL_URL: http://api:4000/api/v1
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # Server-side only, read at RUNTIME (not a build arg, never NEXT_PUBLIC_*): sent as
      # `x-rage-ssr-token` on SSR calls to the API. Must equal the api value.
      INTERNAL_SSR_TOKEN: ${INTERNAL_SSR_TOKEN:-}
      # Reverse proxies in front of web that append to X-Forwarded-For (0 = trust none).
      WEB_TRUST_PROXY_HOPS: ${WEB_TRUST_PROXY_HOPS:-0}
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  s3-data:
